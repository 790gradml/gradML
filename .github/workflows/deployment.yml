name: Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Execute Commands on Remote Server
      run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa
          ssh -p ${{ secrets.REMOTE_PORT }} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} 'bash -s' << 'EOF'
          set -euo pipefail
          export PATH="/home/shensquared/.rbenv/bin:$PATH"
          eval "$(rbenv init -)"
          REF="${{ github.ref }}"
          if [ "$REF" = "refs/heads/main" ]; then
            cd /home/shensquared/gradML
            git fetch origin main
            git reset --hard origin/main
            bundle exec jekyll build
          elif [ "$REF" = "refs/heads/dev" ]; then
            cd /home/shensquared/gradML_dev
            git fetch origin dev
            git reset --hard origin/dev
            bundle exec jekyll build --config _config.yml,_config_dev.yml
          else
            echo "unexpected ref: $REF" >&2
            exit 1
          fi
          echo "deployed $(git rev-parse --short HEAD)"
          EOF
